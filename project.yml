# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
# Signing lives here: `xcodegen generate` rewrites the Xcode project, so changes made in
# Xcode's Signing & Capabilities tab don't survive it.
name: RepCoach
options:
  bundleIdPrefix: com.yeshu
  # Marks the project as checked by this Xcode, so it stops offering "recommended settings".
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: S92P9WJ999
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Xcode 27's recommended settings.
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

packages:
  RepCoachCore:
    path: Packages/RepCoachCore

targets:
  RepCoach:
    type: application
    platform: iOS
    sources: [Apps/iOS, Apps/Shared]
    dependencies:
      - package: RepCoachCore
      - target: RepCoachWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yeshu.RepCoach
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: SpotMe
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: Mark
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: SpotMe reads your heart rate from strength workouts.
        NSHealthUpdateUsageDescription: SpotMe saves your strength workouts to Health.
    entitlements:
      path: Apps/iOS/RepCoach.entitlements
      properties:
        com.apple.developer.healthkit: true

  RepCoachWatch:
    type: application
    platform: watchOS
    sources:
      - Apps/Watch
      - Apps/Shared
      # The complication's views and mark, for the debug gallery that screenshots them.
      - Apps/Widgets/StartWorkoutViews.swift
      - Apps/Widgets/Assets.xcassets
    dependencies:
      - package: RepCoachCore
      - target: RepCoachWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yeshu.RepCoach.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Apps/Watch/Info.plist
      properties:
        CFBundleDisplayName: SpotMe
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.yeshu.RepCoach
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: SpotMe reads your heart rate during strength workouts.
        NSHealthUpdateUsageDescription: SpotMe saves your strength workouts to Health.
        # spotme://start from the complication.
        CFBundleURLTypes:
          - CFBundleURLName: com.yeshu.RepCoach.watchkitapp
            CFBundleURLSchemes: [spotme]
    entitlements:
      path: Apps/Watch/RepCoachWatch.entitlements
      properties:
        com.apple.developer.healthkit: true

  # Watch face complication: today's session, one tap to start it.
  RepCoachWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - Apps/Widgets
      - Apps/Shared/Theme.swift
    dependencies:
      - package: RepCoachCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yeshu.RepCoach.watchkitapp.widgets
    info:
      path: Apps/Widgets/Info.plist
      properties:
        CFBundleDisplayName: SpotMe
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
